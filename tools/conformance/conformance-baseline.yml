# Conformance baseline — known failures, in the harness's own format.
#
# Schema (one list per mode; an entry is `<scenario>` for a whole scenario or
# `<scenario>:<check-id>` for a single check):
#
#   server:
#     - tools-call-with-progress
#     - server-stateless:sep-2575-server-implements-discover
#   client:
#     - sse-retry
#
# Exit-code rules the harness applies (see docs/conformance.md):
#   fails + listed    → 0  (expected)
#   fails + not listed → 1  (regression)
#   passes + listed   → 1  (stale entry — remove it)
#   passes + not listed → 0
#
# Populated from a real run on 2026-11-06 through the bearer proxy
# (`conformance@0.1.11 server --url …/mcp`): 11 passed, 21 failed, 0 unexpected.
# Every entry is a known gap with a reason; the reasons are grouped below. An entry that
# starts passing FAILS CI as stale, so fixing one means deleting its line here.
server:
  # --- optional features QC does not implement and now does NOT advertise (qc#46).
  # MCP logging and completions are optional; a server that omits them is correct, and
  # QC's tools never ask the client for anything. Baselined as an accepted choice, not a
  # bug: the harness runs the scenario regardless of the capability block.
  - completion-complete
  - logging-set-level

  # --- MCP resources and prompts: declined by design (SPEC 12.5, docs/gaps.md).
  # `initialize` should not advertise them until they exist (qc#46).
  - prompts-get-embedded-resource
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-with-image
  - resources-read-binary
  - resources-read-text
  - resources-subscribe
  - resources-templates-read
  - resources-unsubscribe

  # --- tool result shapes QC does not produce. Its tools return text content only,
  # which is legal MCP; these scenarios require image/audio/embedded/mixed content.
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-image
  - tools-call-mixed-content

  # --- client-side capabilities QC does not use: sampling, elicitation, logging,
  # progress notifications. A profiling server has no reason to ask the client for any.
  - tools-call-elicitation
  - tools-call-sampling
  - tools-call-with-logging
  - tools-call-with-progress
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
client: []
