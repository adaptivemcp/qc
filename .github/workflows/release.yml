name: Release

# Publish the `querycleaner` distribution to PyPI via **Trusted Publishing**
# (OIDC) — no API token is stored in the repo.
#
# One-time setup on PyPI — https://pypi.org/manage/account/publishing/ :
#   PyPI project name : querycleaner
#   Owner             : adaptivemcp
#   Repository        : qc
#   Workflow name     : release.yml
#   Environment       : (leave blank)
#
# Then either publish a GitHub Release (`vX.Y.Z`) to upload to PyPI, or run
# this workflow manually to try TestPyPI first (which needs its own publisher
# at https://test.pypi.org/manage/account/publishing/).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where a manual run publishes
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $declared"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Check the built artifacts are the version the tag claims
        if: github.event_name == 'release'
        run: |
          expected="querycleaner-${GITHUB_REF_NAME#v}"
          if ! ls dist/ | grep -q "^${expected}"; then
            echo "::error::built $(ls dist/ | tr '\n' ' ') but the tag claims ${expected}"
            exit 1
          fi
      - name: Validate the distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # OIDC token for Trusted Publishing; no secret is configured.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI on a Release; TestPyPI on a manual run that asks for it.
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
