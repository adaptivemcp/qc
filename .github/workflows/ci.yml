name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Unit & property tests
        run: uv run pytest tests/unit tests/property tests/security -q
      - name: Contract tests (no external services)
        # fixture, fake/bridge, and sqlite need no server, so they run here
        run: uv run pytest tests/contract -q -k "fixture or fake or bridge or sqlite"

  package:
    # Build the sdist+wheel and validate the metadata, so packaging regressions
    # surface on a PR instead of at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Validate the distribution metadata
        run: uvx twine check dist/*

  e2e:
    # End-to-end CLI journeys + the real MCP stdio server. No external services
    # (the server is spawned locally), so this runs on every push/PR.
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: End-to-end tests
        run: uv run pytest tests/e2e -q

  integration-db:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qc_test
          POSTGRES_USER: qc_test
          POSTGRES_DB: qc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qc_test
          MYSQL_DATABASE: qc_test
          MYSQL_USER: qc_test
          MYSQL_PASSWORD: qc_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QC_TEST_POSTGRES_DSN: postgresql://qc_test:qc_test@127.0.0.1:5432/qc_test
      QC_TEST_MYSQL_DSN: mysql://qc_test:qc_test@127.0.0.1:3306/qc_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Connector contract tests (live)
        run: uv run pytest tests/integration tests/contract -q -m integration

  # Blocking since qc#46: `initialize` now advertises only what the server serves, the
  # baseline holds 21 reviewed gaps, and a run has zero unexpected failures. A stale
  # baseline entry fails here too, so the file cannot silently shrink.
  conformance:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Serve QC over HTTP behind the token proxy
        run: |
          set -euo pipefail
          uv run qc init --root "$RUNNER_TEMP/qc-project"
          python - "$RUNNER_TEMP/qc-project/qc.toml" <<'PY'
          import pathlib, sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          patched = text.replace(
              "[mcp.http]\nenabled = false",
              '[mcp.http]\nenabled = true\nauth_token_ref = "env:QC_MCP_HTTP_TOKEN"',
          )
          if patched == text:
              raise SystemExit("qc.toml has no [mcp.http] block to enable")
          path.write_text(patched)
          PY
          export QC_MCP_HTTP_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "QC_MCP_HTTP_TOKEN=$QC_MCP_HTTP_TOKEN" >> "$GITHUB_ENV"
          uv run qc mcp --transport http --root "$RUNNER_TEMP/qc-project" &
          uv run python tools/conformance/bearer_proxy.py \
            --listen 127.0.0.1:3001 --upstream http://127.0.0.1:8765 &
          timeout 90 bash -c 'until curl -sf -X POST http://127.0.0.1:3001/mcp \
            -H "content-type: application/json" \
            -H "accept: application/json, text/event-stream" \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"ci\",\"version\":\"0\"}}}" >/dev/null; do sleep 1; done'
      - name: Conformance
        run: |
          npx -y @modelcontextprotocol/conformance@0.1.11 server \
            --url http://127.0.0.1:3001/mcp \
            --expected-failures tools/conformance/conformance-baseline.yml \
            --output-dir conformance-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: conformance-results
